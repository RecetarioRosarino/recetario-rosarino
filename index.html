<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recetario Rosarino | Recetas Sencillas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animación suave para la aparición del panel de la receta */
        .modal-active {
            animation: cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards scaleUp;
        }
        @keyframes scaleUp {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <span class="text-3xl">🍳</span>
                <h1 class="text-2xl font-black tracking-tight text-orange-600">Recetario<span class="text-gray-700">Rosarino</span></h1>
            </div>
            
            <div class="w-full sm:w-80 relative">
                <input type="text" id="buscador" placeholder="¿Qué tenés en la heladera?..." class="w-full px-4 py-2 bg-gray-100 border border-transparent rounded-xl focus:outline-none focus:bg-white focus:border-orange-500 transition-all text-sm">
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        
        <section class="text-center mb-12">
            <h2 class="text-3xl sm:text-4xl font-extrabold text-gray-900 mb-3">Recetas sencillas para todo</h2>
            <p class="text-gray-600 max-w-xl mx-auto text-base sm:text-lg">Menús ricos, simples y variados.</p>
        </section>

        <div class="flex flex-wrap justify-center gap-3 mb-10" id="contenedor-filtros">
            <button onclick="filtrarCategoria('todas')" id="btn-todas" class="filter-btn px-5 py-2.5 rounded-full bg-orange-600 text-white font-semibold text-sm shadow-md shadow-orange-200 transition-all">Todo</button>
            <button onclick="filtrarCategoria('merienda')" id="btn-merienda" class="filter-btn px-5 py-2.5 rounded-full bg-white text-gray-600 hover:bg-gray-100 font-semibold text-sm transition-all border border-gray-200">🥐 Merienda / Panadería</button>
            <button onclick="filtrarCategoria('almuerzo')" id="btn-almuerzo" class="filter-btn px-5 py-2.5 rounded-full bg-white text-gray-600 hover:bg-gray-100 font-semibold text-sm transition-all border border-gray-200">🍗 Almuerzos</button>
        </div>

        <div class="max-w-3xl mx-auto mb-12 p-4 bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden flex flex-col items-center justify-center min-h-[100px]">
            <span class="text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-2 block w-full text-left px-2 select-none">Publicidad Recomendada</span>
            
            <script async="async" data-cfasync="false" src="https://pl29707269.effectivecpmnetwork.com/c2e72d687ebe1c7d8b760bcebf8128a9/invoke.js"></script>
            <div id="container-c2e72d687ebe1c7d8b760bcebf8128a9" class="w-full flex justify-center"></div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8" id="cuadrilla-recetas"></div>
    </main>

    <div id="modal-receta" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[85vh] overflow-y-auto shadow-2xl p-6 sm:p-8 relative modal-active">
            
            <button onclick="cerrarReceta()" class="absolute top-4 right-4 w-10 h-10 flex items-center justify-center bg-gray-100 hover:bg-gray-200 rounded-full text-gray-700 font-bold transition-colors text-lg">✕</button>
            
            <div id="contenido-modal"></div>
        </div>
    </div>

    <script>
        // Nuestra base de datos de recetas (Materia prima)
        const recetas = [

                emoji: "🍞",

                ingredientes: [

                    "1 sobre de Levadura seca (10g) o 25g de fresca",
                    "1 cucharadita de Sal",
                    "1 cucharada de Aceite (opcional)"
                ],
                pasos: [

                    "Integrá todo con una cuchara hasta formar una masa (no hace falta matarse amasando, solo que no quede harina suelta).",

                ]
            },

                titulo: "Budín de Limón con Aceite",
                descripcion: "Húmedo, esponjoso y baratísimo. Reemplazamos la manteca por aceite para que lo hagas hoy mismo con lo que hay en el mueble.",

            },
            {
                id: 5,
                titulo: "Panqueques de Avena Express",
                descripcion: "Súper esponjosos, saludables y se hacen en 5 minutos metiendo todo en la licuadora. Ideales para arrancar el día con energía.",
                emoji: "🥞",
                tiempo: "10 min",
                categoria: "merienda",
                tags: ["Saludable", "Express"],
                ingredientes: [
                    "1 taza de Avena (tradicional o instantánea)",

                ],
                pasos: [
                    "Meté todos los ingredientes adentro de la licuadora o usá un mixer (avena, huevos, leche, la banana cortada en pedazos y la vainilla).",
                    "Licuá todo a fondo por 1 o 2 minutos hasta que te quede una cremita espesa y sin grumos. Si no tenés licuadora, pisá bien la banana con un tenedor y batí todo a mano.",

                ]
            },
            {
                id: 6,
                titulo: "Tacos de Pollo Desmenuzado",
                descripcion: "Un clásico espectacular y rendidor. Pollo súper tierno cocinado con vegetales salteados y el toque justo de salsa de soja.",
                emoji: "🌮",

                categoria: "almuerzo",

                ingredientes: [
                    "2 Pechugas de pollo",

                    "1 Pimiento (rojo, verde o amarillo)",

                ],
                pasos: [
                    "Herví las pechugas en una olla con abundante agua bien condimentada con sal, granos de pimienta y laurel. Cocinalas hasta que se sientan bien tiernas y se puedan desmenuzar fácil.",
                    "Mientras se hace el pollo, cortá las cebollas y el pimiento en tiras delgadas. Saltealos en una sartén con un chorrito de aceite y una pizca de sal, cocinando hasta que la cebolla quede transparente. Retirá un momento del fuego.",
                    "Sacá el pollo de la olla y, con la ayuda de dos tenedores, desmenuzalo por completo siguiendo la fibra de la carne.",
                    "Agregá todo el pollo desmenuzado a la sartén con los vegetales y volvela al fuego. Mezclá bien para integrar todos los sabores.",
                    "Sumá la salsa de soja y los condimentos a gusto (ají molido, pimienta y rectificá de sal si hace falta). Cociná un par de minutos más para que el pollo absorba todo el jugo y ya está listo para armar tus tacos en unas rapiditas calientes."
                ]
            },
            {
                id: 7,
                titulo: "Budín de Banana y Chocolate",
                descripcion: "Ideal para salvar esas bananas que se pusieron negras en la frutera. Queda ultra húmedo, dulce natural y recontra tentador.",
                emoji: "🍌",
                tiempo: "35 min",
                categoria: "merienda",
                tags: ["Húmedo", "Cero Desperdicio"],
                ingredientes: [
                    "2 o 3 Bananas bien maduras",
                    "2 Huevos",
                    "1/2 taza de Aceite neutro",
                    "3/4 taza de Azúcar (pude ser común o mascabo)",
                    "2 tazas de Harina leudante (o harina común + 2 cditas. de polvo de hornear)",
                    "1 cucharadita de Esencia de vainilla",
                    "Chips de chocolate o nueces picadas (opcional, a gusto)"
                ],
                pasos: [
                    "En un plato hondo o bol, pisá bien las bananas con un tenedor hasta hacerlas puré.",
                    "En otro bol grande, batí los huevos con el azúcar. Agregá el aceite, la esencia de vainilla y sumá el puré de banana integrando todo muy bien.",
                    "Incorporá la harina tamizada de a poco, mezclando suavemente con movimientos envolventes hasta formar una preparación uniforme.",
                    "Si elegiste usar chips de chocolate o nueces, pasalas antes por una pizca de harina (para que no se vayan al fondo) y sumalas a la mezcla.",
                    "Volcá en una budinera previamente aceitada y enharinada. Horneá a fuego medio (180°C) durante 35-40 minutos hasta que al pincharlo salga seco."
                ]
            },
            {
                id: 8,
                titulo: "Budín de Mandarina de Licuadora",
                descripcion: "Se hace literal en 5 minutos metiendo la fruta entera en la licuadora. Queda súper esponjoso y con un aroma espectacular.",
                emoji: "🍊",
                tiempo: "30 min",
                categoria: "merienda",
                tags: ["Ultra Express", "Económico"],
                ingredientes: [
                    "2 Mandarinas medianas",
                    "1/2 taza de Aceite neutro",
                    "1 taza de Azúcar",
                    "2 Huevos",
                    "2 tazas de Harina leudante"
                ],
                pasos: [
                    "Lavá muy bien las mandarinas. Cortá una a la mitad, sacale las semillas y metela entera (con cáscara y todo) adentro de la licuadora. A la otra mandarina pelala, sacale las semillas y meté solo los gajos.",
                    "Agregá a la licuadora los huevos, el aceite y el azúcar. Licuá a fondo durante 2 o 3 minutos hasta que no quede ningún pedacito de cáscara visible.",
                    "Pasá esa crema líquida a un bol e incorporá las dos tazas de harina leudante integrando despacio con batidor de mano o espátula.",
                    "Poné la mezcla en un molde para budín aceitado y enharinado.",
                    "Cocinalo en horno precalentado a temperatura media por unos 30-35 minutos. Dejalo enfriar un poco antes de desmoldar para disfrutar el aroma cítrico intenso."
                ]
            },
            {
                id: 9,
                titulo: "Budín Carrot Cake Casero",
                descripcion: "El budín de zanahoria americano adaptado al mate. Una textura increíble, súper húmedo y con un toque sutil de canela.",
                emoji: "🥕",
                tiempo: "40 min",
                categoria: "merienda",
                tags: ["Premium", "Súper Húmedo"],
                ingredientes: [
                    "2 tazas de Zanahoria rallada fina (unas 2 zanahorias chicas)",
                    "2 Huevos",
                    "1/2 taza de Aceite neutro",
                    "1 taza de Azúcar",
                    "1 y 1/2 tazas de Harina común + 1 y 1/2 cditas. de polvo de hornear",
                    "1 cucharadita de Canela en polvo (clave para el gusto original)",
                    "1/2 taza de Nueces picadas (opcional)"
                ],
                pasos: [
                    "Rallá las zanahorias usando la parte más fina del rallador y reservalas.",
                    "En un bol grande, batí bien los huevos junto con el azúcar y el aceite hasta emulsionar.",
                    "Agregá la zanahoria rallada y mezclá para que se distribuya parejo.",
                    "Sumá la harina, el polvo de hornear y la canela pasados por un colador. Integrá todo sin batir de más.",
                    "Si tenés nueces, agregalas al final para darle el toque crocante perfecto.",
                    "Pasá al molde y llevalo a horno medio durante 40 minutos. Podés decorarlo con azúcar impalpable una vez frío."
                ]
            },
            {
                id: 10,
                titulo: "Torta Invertida de Manzana",
                descripcion: "Un clásico de las tardes de lluvia. Base de bizcochuelo esponjoso cubierto de manzanas tiernas completamente caramelizadas.",
                emoji: "🍎",
                tiempo: "45 min",
                categoria: "merienda",
                tags: ["Un Clásico", "Caramelizado"],
                ingredientes: [
                    "2 Manzanas grandes (rojas o verdes)",
                    "3 Huevos",
                    "1 taza de Azúcar (para el bizcochuelo) + 1/2 taza (para el caramelo de la base)",
                    "1/2 taza de Aceite o 100g de manteca derretida",
                    "2 tazas de Harina leudante",
                    "1/2 taza de Leche",
                    "1 cucharadita de Esencia de vainilla"
                ],
                pasos: [
                    "Poné la media taza de azúcar en el molde de torta redondo que vas a usar (lo ideal es uno de 24 cm) y llevalo directo a fuego mínimo para hacer el caramelo. Movelo despacio hasta que esté dorado, cubriendo bien el fondo y los bordes. Dejá enfriar.",
                    "Pelá las manzanas, sacales el centro y cortalas en gajos medianos. Acomodá los gajos sobre el caramelo seco haciendo una decoración linda en espiral.",
                    "Para la masa, batí los huevos con la taza de azúcar hasta que aclare. Agregá el aceite (o manteca derretida), la esencia de vainilla y mezclá.",
                    "Andá incorporando la harina leudante intercalada con la leche, mezclando con suavidad hasta lograr una masa fluida y sin grumos.",
                    "Volcá la preparación arriba de las manzanas con cuidado y llevala al horno medio (180°C) por 40-45 minutos. Importante: ¡Desmoldala en caliente! Si esperás a que se enfríe, el caramelo se va a pegar al molde y no sale."
                ]
            }
        ];

        let categoriaActual = "todas";

        // Función para renderizar las tarjetas en la pantalla principal
        function renderizarRecetas(lista) {
            const cuadrilla = document.getElementById("cuadrilla-recetas");
            cuadrilla.innerHTML = "";

            if (lista.length === 0) {
                cuadrilla.innerHTML = `<p class="col-span-full text-center text-gray-500 py-12">No encontramos recetas con ese ingrediente... ¡Probá con otra cosa!</p>`;
                return;
            }

            lista.forEach(receta => {
                const tagsHtml = metaTags = receta.tags.map(tag => {
                    let colorClass = "bg-orange-50 text-orange-700";
                    if (tag === "Económico" || tag === "Cero Desperdicio" || tag === "Alto en Proteínas" || tag === "Húmedo" || tag === "Ultra Express") colorClass = "bg-green-50 text-green-700";
                    return `<span class="px-2.5 py-1 text-xs font-bold ${colorClass} rounded-lg">${tag}</span>`;
                }).join('');

                const card = document.createElement("div");
                card.className = "bg-white rounded-3xl overflow-hidden shadow-sm hover:shadow-xl border border-gray-100 transition-all duration-300 flex flex-col group cursor-pointer";
                card.onclick = () => abrirReceta(receta.id);
                card.innerHTML = `
                    <div class="h-48 flex items-center justify-center text-5xl group-hover:scale-105 transition-transform duration-300 select-none bg-gray-50">
                        ${receta.emoji}
                    </div>
                    <div class="p-6 flex flex-col flex-grow">
                        <div class="flex flex-wrap gap-2 mb-3">${tagsHtml}</div>
                        <h3 class="text-xl font-bold text-gray-900 mb-2 group-hover:text-orange-600 transition-colors">${receta.titulo}</h3>
                        <p class="text-gray-600 text-sm line-clamp-2 flex-grow">${receta.descripcion}</p>
                        <div class="flex items-center justify-between border-t border-gray-50 pt-4 mt-4 text-xs font-semibold text-gray-500">
                            <span>⏱️ ${receta.tiempo}</span>
                            <span class="text-orange-500 font-bold text-sm">Ver Receta →</span>
                        </div>
                    </div>
                `;
                cuadrilla.appendChild(card);
            });
        }

        // Lógica para abrir el Modal y rellenar la receta limpia
        function abrirReceta(id) {
            const receta = recetas.find(r => r.id === id);
            if (!receta) return;

            const contenedorModal = document.getElementById("contenido-modal");
            
            const ingredientesHtml = receta.ingredientes.map(ing => `
                <label class="flex items-start gap-3 p-2 hover:bg-gray-50 rounded-xl cursor-pointer transition-colors">
                    <input type="checkbox" class="mt-1 accent-orange-500 rounded border-gray-300 focus:ring-orange-500 h-4 w-4">
                    <span class="text-gray-700 text-sm sm:text-base">${ing}</span>
                </label>
            `).join('');

            const pasosHtml = receta.pasos.map((paso, index) => `
                <div class="flex gap-4">
                    <div class="flex-shrink-0 w-7 h-7 bg-orange-100 text-orange-700 font-bold text-sm flex items-center justify-center rounded-full mt-0.5">
                        ${index + 1}
                    </div>
                    <p class="text-gray-600 text-sm sm:text-base leading-relaxed">${paso}</p>
                </div>
            `).join('');

            contenedorModal.innerHTML = `
                <div class="flex items-center gap-3 mb-4 mt-2">
                    <span class="text-4xl">${receta.emoji}</span>
                    <h3 class="text-2xl font-black text-gray-900">${receta.titulo}</h3>
                </div>
                <p class="text-gray-500 text-sm mb-6">${receta.descripcion}</p>
                
                <div class="grid grid-cols-1 md:grid-cols-5 gap-8">
                    <div class="md:col-span-2">
                        <h4 class="font-bold text-gray-900 mb-3 text-lg flex items-center gap-2">📋 Ingredientes <span class="text-xs text-gray-400 font-normal">(Tachá los que tenés)</span></h4>
                        <div class="flex flex-col gap-1 bg-gray-50 p-3 rounded-2xl">${ingredientesHtml}</div>
                    </div>
                    <div class="md:col-span-3">
                        <h4 class="font-bold text-gray-900 mb-3 text-lg">👨‍🍳 Preparación</h4>
                        <div class="flex flex-col gap-5">${pasosHtml}</div>
                    </div>
                </div>
            `;

            const modal = document.getElementById("modal-receta");
            modal.classList.remove("opacity-0", "pointer-events-none");
            document.body.style.overflow = "hidden"; // Traba el scroll del fondo
        }

        // Función para cerrar la receta flotante
        function cerrarReceta() {
            const modal = document.getElementById("modal-receta");
            modal.classList.add("opacity-0", "pointer-events-none");
            document.body.style.overflow = "auto"; // Libera el scroll
        }

        // DETALLES PRO: Cerrar al hacer clic en el fondo oscuro
        document.getElementById("modal-receta").addEventListener("click", function(evento) {
            if (evento.target === this) {
                cerrarReceta();
            }
        });

        // DETALLES PRO: Cerrar al apretar la tecla "ESC"
        document.addEventListener("keydown", function(evento) {
            if (evento.key === "Escape") {
                cerrarReceta();
            }
        });

        // Filtros fluidos por categoría
        function filtrarCategoria(cat) {
            categoriaActual = cat;
            
            document.querySelectorAll(".filter-btn").forEach(btn => {
                btn.className = "filter-btn px-5 py-2.5 rounded-full bg-white text-gray-600 hover:bg-gray-100 font-semibold text-sm transition-all border border-gray-200";
            });
            const btnActivo = document.getElementById(`btn-${cat}`);
            btnActivo.className = "filter-btn px-5 py-2.5 rounded-full bg-orange-600 text-white font-semibold text-sm shadow-md shadow-orange-200 transition-all";

            ejecutarFiltros();
        }

        // Lógica del buscador predictivo en tiempo real
        document.getElementById("buscador").addEventListener("input", ejecutarFiltros);

        function ejecutarFiltros() {
            const textoBusqueda = document.getElementById("buscador").value.toLowerCase().trim();
            
            let recetasFiltradas = recetas;

            if (categoriaActual !== "todas") {
                recetasFiltradas = recetasFiltradas.filter(r => r.categoria === categoriaActual);
            }

            if (textoBusqueda !== "") {
                recetasFiltradas = recetasFiltradas.filter(r => 
                    r.titulo.toLowerCase().includes(textoBusqueda) ||
                    r.descripcion.toLowerCase().includes(textoBusqueda) ||
                    r.ingredientes.some(ing => ing.toLowerCase().includes(textoBusqueda))
                );
            }

            renderizarRecetas(recetasFiltradas);
        }

        // Arrancar la web mostrando todo al principio
        renderizarRecetas(recetas);
    </script>
</body>
</html>
